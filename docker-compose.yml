version: '3.8'

services:
  app:
    # Instrucciones para construir la imagen Docker para este servicio.
    build:
      # El contexto de construcción es el directorio actual.
      context: .
      # Apuntamos al Dockerfile de desarrollo en lugar del de producción.
      dockerfile: Dockerfile.dev 

    # El puerto 3000 del host se mapea al puerto 3000 del contenedor.
    ports:
      - "3000:3000"

    # ¡LA CLAVE DEL HOT-RELOADING!
    # Monta el código local en el contenedor para que los cambios se reflejen al instante.
    volumes:
      - .:/app
      # Evita que la carpeta node_modules local sobreescriba la del contenedor.
      - /app/node_modules

    # Asigna un nombre específico al contenedor para una fácil identificación.
    container_name: front-ventas-dev 

    # Política de reinicio: útil para desarrollo.
    restart: unless-stopped